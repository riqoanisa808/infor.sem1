{t:"Informatika di Sekolah Menengah Atas",m:`<h3>1. Informatika</h3><p>Informatika (<i>informatics</i>) adalah disiplin ilmu tentang pengolahan informasi menggunakan komputer. Namanya berasal dari <b>informasi</b> dan <b>matematika</b>, karena matematika dipakai untuk mengolah informasi agar berguna bagi manusia. Informatika mencakup pemodelan komputasi dan penerapannya dalam pengembangan sistem komputer.</p>
<ul><li><b>Komputasi (bidang matematika)</b>: ilmu untuk menyelesaikan masalah yang melibatkan pengelolaan, pengolahan, dan analisis data secara komputasi.</li>
<li><b>Komputasi (bidang teknologi komputer)</b>: aktivitas penggunaan dan pengembangan teknologi komputer, perangkat keras, dan perangkat lunak.</li></ul>
<div class="box">Dasar berpikir informatika adalah <b>berpikir komputasional</b> (<i>computational thinking</i>), dengan empat pilar: <b>dekomposisi, abstraksi, pengenalan pola, algoritma</b>.</div>
<h3>2. Informatika dan Revolusi Industri 4.0</h3><p>Revolusi industri 4.0 dikenal dengan istilah <i>cyber physical system</i>, yaitu mengolaborasikan <b>teknologi siber</b> dan <b>teknologi otomatisasi</b>. Keterlibatan manusia dalam suatu kegiatan dikurangi dan digantikan teknologi canggih sehingga kerja menjadi lebih efektif dan efisien. Karena hidup di dunia fisik sekaligus dunia siber (maya), masyarakat sekarang dijuluki masyarakat <b>Society 5.0</b>.</p>
<h3>3. Alasan Belajar Informatika</h3><p>Masyarakat Society 5.0 memanfaatkan mesin cerdas berbasis internet dan komputer. Pekerjaan manusia makin banyak diambil alih mesin, sehingga belajar informatika menjadi langkah awal menghadapi perkembangan zaman, membuka lapangan kerja, dan melatih cara berpikir yang bernalar kritis dan kreatif.</p>
<h3>4. Bidang Pengetahuan Informatika</h3><p>Ada delapan bidang: berpikir komputasional (BK), teknologi informasi dan komunikasi (TIK), sistem komputer (SK), jaringan komputer dan internet (JKI), analisis data (AD), algoritma dan pemrograman (AP), dampak sosial informatika (DSI), dan praktik lintas bidang (PLB).</p>
<h3>5. Materi Informatika Kelas X</h3><ul>
<li><b>BK</b>: strategi penyelesaian persoalan yang tidak intuitif dan naif, agar komputasi lebih efisien dan optimal.</li>
<li><b>TIK</b>: integrasi antaraplikasi, fitur aplikasi lanjut, dan fitur otomasi.</li>
<li><b>SK</b>: perangkat keras, komponen komputer, sistem operasi, penyimpanan data dan program di memori, serta pemrosesan instruksi.</li>
<li><b>AD</b>: pengelolaan dan penyajian data bervolume besar, analisis lebih kompleks, dan otomasi pengambilan data dari internet.</li>
<li><b>AP</b>: membuat program dengan bahasa pemrograman tekstual dan strategi berpikir komputasional.</li>
<li><b>DSI</b>: dampak informatika di bidang ekonomi, hukum, keterbukaan informasi, serta karier di bidang informatika.</li>
<li><b>PLB</b>: bekerja sama secara kolaboratif merancang solusi persoalan sosial yang mengandung perangkat lunak aplikasi.</li></ul>
<h3>6. Informatika dan Profil Pelajar Pancasila</h3><p>Selain ilmu, kita harus membekali diri dengan karakter luhur. Enam dimensi profil pelajar Pancasila: <b>beriman, bertakwa kepada Tuhan YME, dan berakhlak mulia; berkebinekaan global; bergotong royong; mandiri; bernalar kritis; kreatif</b>. Bergotong royong adalah bentuk kolaborasi untuk mencapai tujuan bersama dan melatih kepedulian pada lingkungan sekitar.</p>`,

{t:"Berpikir Komputasional",m:`<p>Berpikir komputasional adalah cara menyelesaikan persoalan dengan teknik ilmu komputer, secara sistematis, logis, dan dapat diotomatisasi lewat algoritma.</p>
<h3>Empat pilar</h3><ul>
<li><b>Dekomposisi</b>: memecah masalah besar menjadi bagian kecil.</li>
<li><b>Pengenalan pola</b>: menemukan kemiripan atau karakteristik solusi.</li>
<li><b>Abstraksi</b>: menyaring hal penting, mengabaikan detail yang tidak perlu.</li>
<li><b>Algoritma</b>: menyusun langkah penyelesaian secara berurutan.</li></ul>

{t:"Algoritma Pencarian dan Pengurutan",m:`<h3>Binary Search</h3>
<p>Mencari data pada array yang <b>sudah terurut</b> dengan terus membagi dua daerah pencarian. Nilai tengah: <code>(posisi awal + posisi akhir) / 2</code>. Jika target lebih besar dari nilai tengah, cari di bagian kanan; jika lebih kecil, cari di bagian kiri. Disebut juga half-interval search.</p>
<h3>Selection Sort</h3>
<ol><li>Cari bilangan terkecil pada bagian belum terurut.</li><li>Tukar dengan bilangan pertama bagian belum terurut.</li><li>Ulangi sampai bagian belum terurut habis.</li></ol>`,

{t:"Stack dan Queue",m:`<h3>Tumpukan (Stack)</h3>
<p>Kaidah <b>LIFO / FILO</b> (Last In First Out): data terakhir masuk keluar pertama, seperti tumpukan piring. Operasi: <b>Push</b> (memasukkan elemen), <b>Pop</b> (menghapus elemen teratas), dan <b>Peek</b> (melihat elemen teratas).</p>
<h3>Antrean (Queue)</h3>
<p>Kaidah <b>FIFO</b> (First In First Out). Penambahan di belakang (<i>rear</i>), pengambilan di depan (<i>front</i>). Operasi: <b>Enqueue</b> (memasukkan data), <b>Dequeue</b> (mengeluarkan data), <b>isEmpty</b> dan <b>isFull</b> (memeriksa kosong atau penuh).</p>`,

{t:"Pengumpulan Data",m:`<p>Data adalah fakta atau bagian fakta yang digambarkan dengan simbol, gambar, nilai, atau uraian yang bermakna pada konteks tertentu.</p>

{t:"Sistem Komputer dan Interaksi",m:`<p>Sistem komputer terdiri atas tiga bagian: <b>perangkat keras</b> (hardware), <b>perangkat lunak</b> (software), dan <b>pengguna</b> (brainware).</p>

<li><b>GUI</b>: antarmuka grafis (ikon, menu). <b>CLI</b>: antarmuka perintah teks.</li>

{t:"Praktik Lintas Bidang",m:`<p>Praktik lintas bidang (PLB) mempelajari cara bekerja sama secara kolaboratif untuk merancang solusi persoalan sosial yang mengandung perangkat lunak aplikasi. Ada <b>tujuh aspek</b> PLB:</p>
<ol><li>Membina dan menumbuhkan budaya kerja masyarakat digital dalam tim yang inklusif.</li>
<li>Berkolaborasi untuk melaksanakan tugas dengan tema sistem komputasi.</li>
<li>Mengenali dan mendefinisikan persoalan yang pemecahannya dapat didukung sistem komputasi.</li>
<li>Mengembangkan dan menggunakan abstraksi.</li>
<li>Mengembangkan artefak komputasi, misalnya program sederhana untuk menunjang model komputasi.</li>
<li>Mengembangkan rencana pengujian, menguji, dan mendokumentasikan hasil uji artefak komputasi.</li>
<li>Mengomunikasikan proses, fenomena, atau solusi TIK dengan mempresentasikan dan memvisualisasikan, serta memperhatikan hak kekayaan intelektual.</li></ol>`,
q:[["Bidang yang mempelajari kerja sama kolaboratif untuk merancang solusi persoalan sosial berbasis perangkat lunak aplikasi adalah ....",["Praktik lintas bidang","Sistem komputer","Jaringan komputer","Berpikir komputasional"],0]]},
{t:"Kolaborasi",m:`<p>Kolaborasi (kerja kelompok) berasal dari <i>co</i> dan <i>labor</i>: penyatuan tenaga untuk mencapai tujuan bersama. Dua orang atau lebih saling memahami permasalahan masing-masing dan saling membantu memecahkannya. Kolaborasi memerlukan pemimpin yang membagi tugas dan peran secara adil.</p>
<div class="box">Dua prasyarat kolaborasi: <b>tentukan tujuan kolaborasi</b>, dan <b>pastikan persamaan persepsi serta deskripsi lengkap</b> tentang prakondisi masing-masing. Prasyarat umum dilandasi kesadaran dan kerendahan hati untuk saling berbagi.</div>
<h3>Langkah kolaborasi yang efektif</h3><ol><li>Pahami persoalan dan tujuan bersama.</li><li>Lakukan pembagian peran.</li><li>Kerjakan tugas sesuai peran masing-masing.</li><li>Subtim berkumpul untuk mengintegrasikan hasil kerja.</li><li>Koordinasi antarsubtim diwakili ketua subtim.</li><li>Ketua kelompok memimpin diskusi untuk merumuskan kesimpulan.</li></ol>`,

{t:"Komunikasi: Infografis dan Presentasi",m:`<p>Keterampilan komunikasi adalah kemampuan berkomunikasi efektif secara lisan, tertulis, grafik, dan nonverbal untuk memberi informasi dalam pengambilan keputusan. Hasil kerja dapat disampaikan lewat <b>infografis</b> dan <b>presentasi</b>.</p>
<h3>Infografis</h3><p>Penyajian data atau informasi dalam bentuk visual (tipografi, warna, ilustrasi, ikon) yang jelas, ringkas, mudah dipahami, dan tidak ambigu.</p>
<ul><li><b>Geografis</b>: data lokasi dalam bentuk peta.</li><li><b>Chart</b>: berbagai jenis grafik.</li><li><b>Statistik</b>: pertumbuhan atau peningkatan dengan rentang waktu tertentu.</li><li><b>Timeline</b>: data berurutan menurut tanggal atau tahun, dengan garis tegas sebagai patokan waktu.</li><li><b>Informasi</b>: penjelasan poin per poin dengan judul deskriptif.</li><li><b>Daftar</b>: tips, trik, dan sejenisnya.</li><li><b>Hierarkis</b>: level tertinggi hingga terendah (piramida).</li><li><b>Perbandingan</b>: persamaan dan perbedaan dua objek atau lebih.</li><li><b>Proses</b>: alur bertahap dengan angka atau SmartArt.</li></ul>
<p>Fungsi infografis: membuat informasi lebih mudah dipahami, lebih menarik, dan menyederhanakan data yang kompleks.</p>
<div class="box">Tahapan membuat infografis: (1) tentukan topik, (2) cari data valid, (3) identifikasi target audiens, (4) tentukan pesan utama, (5) rancang desain, (6) publikasikan.</div>
<h3>Presentasi</h3><p>Berbicara di depan banyak orang untuk menyampaikan gagasan atau materi.</p>
<ul><li><b>Konten</b>: memuat ringkasan, latar belakang, paparan utama, dan penutup; berupa butir kata kunci.</li>
<li><b>Tampilan</b>: huruf cukup besar, seimbang antara teks dan gambar, jumlah lembar sesuai waktu.</li>
<li><b>Persiapan</b>: siapkan bahan dan alat bantu, perhatikan pendengar dan konteks, jelaskan produk dengan alur logis.</li>
<li><b>Tanya jawab</b>: jawab ringkas dan tegas; jika kurang paham, ulangi pertanyaan untuk klarifikasi.</li></ul>`,

{t:"Aplikasi Perkantoran",m:`<p>Aplikasi perkantoran (aplikasi <i>office</i>) adalah kumpulan aplikasi atau perangkat lunak yang digunakan untuk meningkatkan produktivitas. Tiga jenis yang umum digunakan:</p>
<h3>1. Aplikasi pengolah kata (<i>word processor</i>)</h3><p>Program untuk menyusun, menyunting, dan memformat dokumen serta mencetaknya pada media seperti kertas. Contoh: Microsoft Word, Open Office Word, dan Google Docs. Ekstensi file Word: <code>.docx</code>.</p>
<h3>2. Aplikasi pengolah angka (<i>spreadsheet</i>)</h3><p>Program untuk mengolah data berupa angka dalam lembar kerja, yaitu tabel dua dimensi yang terdiri atas kolom dan baris. Contoh: Microsoft Excel, Open Office Spreadsheet, Google Sheet, dan Star Office Calc. Ekstensi file Excel: <code>.xlsx</code>.</p>
<h3>3. Aplikasi presentasi (<i>slide</i>)</h3><p>Program untuk membuat slide presentasi dengan mudah, cepat, dan menarik. Contoh: Microsoft PowerPoint, Open Office Presentation, dan Google Slide. Ekstensi file PowerPoint: <code>.pptx</code>.</p>
<div class="box">Banyak pekerjaan kini mensyaratkan kemampuan memakai aplikasi perkantoran untuk membuat laporan dan jadwal kerja secara digital.</div>`,

{t:"Fitur Lanjut Aplikasi Perkantoran",m:`<h3>1. Mail Merge (Word dan Excel)</h3><p>Fasilitas untuk surat menyurat massal, misalnya surat undangan, tagihan, promosi, sertifikat, label, dan amplop yang dikirim ke banyak penerima. Dua hal penting: <b>dokumen inti</b> (format dasar surat) dan <b>sumber data</b> (nama, alamat, dan sebagainya yang digabungkan).</p>
<p>Langkah contoh (invoice pesanan martabak lewat e-mail):</p>
<ol><li>Di Excel, buat tabel nama pemesan, jenis martabak, harga, dan alamat e-mail, lalu simpan (misalnya bernama Mail Merge).</li>
<li>Di Word buat dokumen baru: <b>Mailings &gt; Start Mail Merge &gt; E-mail Messages</b> (atau Letters jika tidak dikirim lewat e-mail).</li>
<li><b>Select Recipients &gt; Use an Existing List</b>, pilih file Excel tadi, klik OK.</li>
<li>Ketik isi surat; untuk variabel pilih <b>Insert Merge Field</b> &gt; Nama, Martabak, atau Harga.</li>
<li>Klik <b>Preview Results</b> untuk melihat hasil.</li>
<li>Simpan: <b>Finish &amp; Merge &gt; Print Documents &gt; Microsoft Print to PDF</b>. Kirim e-mail: <b>Finish &amp; Merge &gt; Send Email Messages</b>, tulis subject, lalu OK (terbuka Outlook).</li></ol>
<h3>2. Daftar isi otomatis di Microsoft Word</h3><p>Daftar isi memberi gambaran struktur dan isi buku. Langkahnya: (1) beri style <b>Heading 1, Heading 2, Heading 3</b>, dan seterusnya pada judul dan subjudul, (2) klik bagian yang akan menjadi halaman daftar isi, (3) buka tab <b>References</b>, (4) klik <b>Table of Contents</b> dan pilih modelnya. Nomor halaman terisi otomatis.</p>
<h3>3. Video presentasi di Microsoft PowerPoint</h3><p>Fitur rekam layar tersedia umum sejak seri 2013 untuk membuat presentasi bernarasi dan berpotongan video narator.</p>
<ol><li>Buat presentasi; tampilkan tab Recording: <b>File &gt; Options &gt; Customize Ribbon &gt; centang Recording</b>.</li>
<li>Klik <b>Record Slide Show</b>; kamera webcam dapat diaktifkan, dan tersedia pen serta highlighter.</li>
<li>Klik <b>Record</b> (ada hitung mundur), lalu berbicara; pindah slide dengan panah keyboard atau layar.</li>
<li><b>Pause</b> untuk jeda, <b>Stop</b> untuk berhenti. Salah narasi: <b>Clear Recording on Current Slide</b>; hapus semua: <b>Clear Recording on All Slides</b> (permanen).</li>
<li>Selesai: tekan <b>Esc</b>. Ekspor video: <b>Export to Video</b> (MP4) &gt; pilih kualitas &gt; <b>Create a Video</b>.</li></ol>`,

{t:"Mesin Pencari",m:`<p>Browser dapat dipakai mencari informasi karena memiliki <b>mesin pencari</b> (<i>search engine</i>) yang mengumpulkan informasi sesuai keinginan kita.</p>
<h3>Sejarah singkat</h3><ul><li><b>1990</b>: Tim Berners-Lee menciptakan World Wide Web (WWW), awal berkembangnya mesin pencari. Seiring bertambahnya halaman web, muncul upaya menyederhanakan pencarian.</li>
<li><b>Archie</b>: membuat indeks nama file dan lokasinya di server FTP; pengguna mencari dengan perintah sederhana.</li>
<li><b>Veronica</b> (1992, Universitas McGill): memperluas Archie, dapat mencari dan mengindeks <i>isi</i> file teks, sedangkan Archie hanya mencari file.</li>
<li><b>Wanderer</b> (1993, Matthew Gray, MIT): salah satu bot atau <i>crawler</i> paling awal; menjelajahi web otomatis lewat tautan, menyalin dan mengindeks halaman.</li>
<li><b>Spider</b> (web crawler): komponen penting mesin pencari modern; mulai dari daftar URL yang dikenal, menemukan URL baru lewat tautan, dan terus memperbarui indeks.</li></ul>
<h3>Tiga tahap cara kerja</h3><ol><li><b>Information gathering</b>: spider mengunjungi dan merayapi situs, mengumpulkan teks, gambar, tautan, dan struktur halaman.</li>
<li><b>Indexing</b>: informasi disimpan dalam database besar beserta metadata (judul, deskripsi, tautan, struktur) agar cepat diambil.</li>
<li><b>Searching</b>: kueri pengguna (kata kunci, frasa, pertanyaan) dicocokkan dengan indeks memakai algoritma yang mempertimbangkan frekuensi dan posisi kata kunci, kualitas konten, dan popularitas tautan. Hasil ditampilkan sebagai tautan beserta cuplikan (<i>snippet</i>).</li></ol>
<h3>Macam-macam mesin pencari</h3><ul><li><b>Google</b> dan <b>Yahoo!</b> (salah satu yang tertua).</li><li><b>Bing</b>: dikembangkan Microsoft.</li><li><b>DuckDuckGo</b>: menjaga privasi; pengguna tidak perlu akun pribadi dan tidak dikumpulkan alamat IP-nya.</li></ul>`,

{t:"Kolaborasi dalam Sistem Komputer dan Sistem Operasi",m:`<h3>Tiga bentuk interaksi</h3><ul><li><b>Software dengan software</b>: komunikasi atau kerja sama antarprogram. Contoh: laptop baru perlu dipasang sistem operasi sebelum dapat memakai aplikasi pengolah kata.</li>
<li><b>Hardware dengan hardware</b>: perangkat keras bekerja bersama, misalnya input (mouse, keyboard), proses, lalu output (monitor). Tetap butuh perangkat lunak sebagai perantara.</li>
<li><b>Software dengan hardware</b>: perangkat lunak harus dapat mengenali atau dikenali perangkat keras. Contoh: memasang <b>driver</b> agar komputer mengenali printer. Driver adalah komponen system software sebagai perantara komunikasi antara sistem operasi dan hardware.</li></ul>
<h3>Sistem operasi</h3><p>Berperan sebagai <b>resource manager</b> (mengelola seluruh sumber daya sistem komputer) dan <b>extended machine</b> (menyediakan layanan agar komputer mudah dan nyaman dipakai). Saat komputer dihidupkan, CPU belum berisi program; proses menyalakan komputer dan memulai sistem operasi disebut <b>booting</b>.</p>
<h3>Fungsi dan peran sistem operasi</h3><ol><li>Menyediakan antarmuka bagi pengguna.</li><li>Mengendalikan input dan output.</li><li>Mengelola perangkat keras dan periferal.</li><li>Mengelola pemuatan dan eksekusi perangkat lunak.</li><li>Mengelola sistem pengarsipan file dan folder (copy, save, sort, delete, cut).</li><li>Menangani interupsi dan kesalahan (error).</li><li>Mengelola prosesor atau CPU.</li></ol>`,

{t:"Proteksi Data saat Berinternet",m:`<p>Saat berinternet perlu kesadaran untuk tidak sembarangan memasukkan identitas pribadi karena banyak kejahatan di dunia maya. Cara melindungi data:</p>
<ol><li><b>Pastikan data terenkripsi.</b> Enkripsi mengubah data (<i>plaintext</i>) menjadi format yang sulit dimengerti (<i>ciphertext</i>), sehingga hanya pemilik kunci rahasia yang dapat mengembalikannya. Tujuannya melindungi kerahasiaan dan integritas data dari akses tidak sah. Situs HTTPS lebih aman daripada HTTP karena memakai enkripsi lapisan SSL/TLS.</li>
<li><b>Hati-hati menggunakan Wi-Fi.</b> Wi-Fi dapat disalahgunakan, misalnya lewat access point palsu yang mencuri username dan password.</li>
<li><b>Waspadai tautan phishing.</b> Tautan dapat mengarah ke halaman login palsu. Periksa domain situs; situs pemerintah memakai domain .go.id.</li>
<li><b>Gunakan password sulit ditebak</b> (kombinasi karakter) dan ganti setiap tiga bulan.</li>
<li><b>Gunakan mode incognito.</b> Browser tidak merekam data login, cache, dan cookies dari situs yang dikunjungi.</li></ol>`,

S0[1].t="Mengenal Berpikir Komputasional";
S0[1].m=`<p>Berpikir komputasional adalah metode menyelesaikan persoalan dengan menerapkan teknik ilmu komputer (informatika): memecahkan masalah secara sistematis dan logis, serta mengotomatisasi solusi melalui cara berpikir algoritma. Prosesnya dapat dieksekusi oleh manusia maupun mesin. Keterampilan ini juga dibutuhkan dalam kehidupan sehari-hari, misalnya perencanaan dan pengambilan keputusan.</p>
<h3>Karakteristik</h3><ul><li>Mampu melakukan generalisasi solusi untuk berbagai masalah berbeda.</li><li>Mampu melakukan otomatisasi solusi melalui cara berpikir algoritma.</li><li>Mampu memberi pemecahan masalah dengan komputer atau perangkat lain.</li><li>Mampu mengidentifikasi, menganalisis, dan mengimplementasikan solusi secara efisien dan efektif.</li><li>Memiliki logika dalam mengelompokkan dan menganalisis data.</li><li>Mampu merepresentasikan data melalui abstraksi dengan model atau simulasi.</li></ul>
<h3>Empat fondasi berpikir komputasional</h3>
<p><b>1. Dekomposisi</b>: memecah masalah kompleks menjadi bagian-bagian lebih kecil dan mudah dipecahkan. Langkahnya: (1) identifikasi masalah utama, (2) susun daftar komponen utama, (3) susun daftar bagian-bagian kecilnya, (4) buat rencana penyelesaian sesuai urutan (algoritma), (5) selesaikan setiap bagian kecil hingga detail.</p>
<p><b>2. Pengenalan pola</b>: menemukan karakteristik solusi terhadap suatu permasalahan. Caranya: melihat pola secara menyeluruh, memikirkan pola dengan matang, dan merasakan pola.</p>
<p><b>3. Abstraksi</b>: metode cepat memecahkan masalah baru berdasarkan pengalaman pada masalah sejenis. Langkahnya: kumpulkan submasalah hasil dekomposisi, tentukan skala kebutuhan tiap submasalah terhadap masalah kompleks, lalu hilangkan submasalah yang kurang penting.</p>
<p><b>4. Algoritma</b>: tahapan mengambil penyelesaian masalah sesuai fakta yang ada. Sembilan langkah pemikiran algoritmik:</p>
<div class="box">(1) Definisi masalah, (2) pengembangan model, (3) spesifikasi algoritma, (4) merancang algoritma, (5) memeriksa kebenaran algoritma, (6) analisis algoritma, (7) implementasi algoritma, (8) pengujian program, (9) persiapan dokumentasi.</div>`;
S0[2].t="Pencarian dan Pengurutan";
S0[2].m=`<h3>Pencarian (Searching)</h3><p>Proses menemukan data tertentu dalam kumpulan data bertipe sama. Dua metode: sequential search dan binary search.</p>
<p><b>Sequential search</b>: membandingkan data yang dicari dengan elemen satu per satu dari awal sampai akhir. Tidak perlu data terurut. Jika ditemukan, dikembalikan indeksnya; jika tidak, dikembalikan -1.</p>
<div class="box">Contoh: x = 33 pada 17, 35, 33, 76 ditemukan, IDX = 2. Contoh: x = 37 pada 33, 43, 20, 47, 15 tidak ditemukan, IDX = -1.</div>
<p><b>Binary search</b>: pencarian dimulai dari data tengah pada data yang <b>sudah terurut</b>. Jika data dicari lebih kecil dari nilai tengah, cari di separuh pertama; jika lebih besar, cari di separuh kedua. Disebut juga half-interval search, logarithmic search, atau binary chop.</p>
<div class="box">Mencari 7 pada 1 sampai 10: r = (0 + 9) / 2 = 4, data ke-4 adalah 5. Karena 7 lebih besar, daftar menjadi 6, 7, 8, 9, 10. Nilai tengahnya 8; 7 lebih kecil, daftar menjadi 6, 7. Nilai tengah 7 sama dengan yang dicari: ditemukan.</div>
<h3>Pengurutan (Sorting)</h3><p>Menyusun kembali data menurut aturan tertentu: menaik (<i>ascending</i>, L[1] ≤ L[2] ≤ ... ≤ L[N]) atau menurun (<i>descending</i>). Data berbentuk record diurutkan berdasarkan <i>field kunci</i>.</p>
<p><b>Bubble sort</b>: membandingkan dua elemen bersebelahan dan menukarnya jika urutannya salah, diulang sampai terurut.</p>
<div class="box"><code>Semua: 80 45 19 55 32 23<br>It-1: 19 80 45 23 55 32<br>It-2: 19 23 80 45 32 55<br>It-3: 19 23 32 80 45 55<br>It-4: 19 23 32 45 80 55<br>It-5: 19 23 32 45 55 80</code></div>
<p><b>Selection sort</b>: (1) cari bilangan terkecil di bagian belum terurut, (2) tukar dengan bilangan pertama bagian belum terurut, (3) ulangi sampai habis.</p>
<div class="box"><code>Semua: 45 54 15 83 13 76<br>It-1: 13 54 15 83 45 76<br>It-2: 13 15 54 83 45 76<br>It-3: 13 15 45 83 54 76<br>It-4: 13 15 45 54 83 76<br>It-5: 13 15 45 54 76 83</code></div>
<p><b>Insertion sort</b>: menyisipkan setiap elemen ke posisi yang tepat pada bagian yang sudah terurut, seperti menyusun kartu di tangan.</p>
<div class="box"><code>Semua: 14 11 37 52 33 45<br>It-2: 11 14 37 52 33 45<br>It-5: 11 14 33 37 52 45<br>It-6: 11 14 33 37 45 52</code></div>`;
S0[3].t="Tumpukan (Stack) dan Antrean (Queue)";
S0[3].m=`<p>Stack dan queue adalah struktur data yang menentukan cara data disimpan dan diproses.</p>
<h3>Tumpukan (Stack)</h3><p>Data hanya dapat diambil atau ditambah dari bagian atas, seperti tumpukan barang dalam tempat yang hanya punya satu pintu. Kaidahnya <b>LIFO</b> atau FILO (Last In First Out): data terakhir masuk keluar pertama.</p>
<ul><li><b>Push</b>: memasukkan elemen ke bagian atas.</li><li><b>Pop</b>: menghapus elemen teratas.</li><li><b>IsFull / IsEmpty</b>: memeriksa tumpukan penuh atau kosong.</li><li><b>Peek</b> (mengintip): melihat data teratas tanpa menghapusnya.</li></ul>
<p>Stack dapat diimplementasikan dengan <b>array</b> (akses berdasarkan indeks) atau <b>linked list</b> (push menjadi <i>addAtFront</i>, pop menghapus node depan).</p>
<p>Contoh: tumpukan buku di rak, tumpukan piring di dapur, dan fungsi <i>undo</i> pada pengolah teks.</p>
<h3>Antrean (Queue)</h3><p>Elemen ditambahkan di belakang (<i>rear</i>) dan diambil dari depan (<i>front</i>). Kaidahnya <b>FIFO</b> (First In First Out).</p>
<ul><li><b>Enqueue</b>: memasukkan data ke antrean.</li><li><b>Dequeue</b>: mengeluarkan data dari antrean.</li><li><b>IsFull / IsEmpty</b>: memeriksa antrean penuh atau kosong.</li><li><b>Clear</b>: menghapus seluruh antrean.</li></ul>
<p>Contoh: antrean di tempat pembayaran supermarket, dan penumpang di halte bus atau terminal.</p>`;
S0[4].t="Ekosistem Periksa Fakta dan Evaluasi Informasi";
S0[4].m=`<h3>Fakta</h3><p>Fakta (dari kata Latin <i>factus</i>) adalah hal atau peristiwa yang benar-benar terjadi dan dapat dibuktikan kebenarannya secara empiris. Ciri-cirinya: (1) <b>ada data akurat</b> seperti angka, tanggal, atau pernyataan yang dapat diverifikasi, (2) <b>bersifat objektif</b> (netral, tidak memihak), dan (3) <b>telah benar-benar terjadi</b> serta dapat disaksikan banyak orang. Di era digital, fakta harus didukung data akurat yang dapat diverifikasi.</p>
<h3>Berita palsu (hoaks)</h3><p>Informasi yang sengaja dibuat atau disebarkan untuk menyesatkan atau memanipulasi opini publik. Cepat menyebar di media sosial, kurang akurat, tidak didukung sumber yang dapat diverifikasi, dan sering berjudul menarik serta kontroversial.</p>
<h3>Organisasi cek fakta di Indonesia</h3><p>Bekerja dengan mekanisme <i>crowdsourcing</i>. Enam organisasi tersertifikasi IFCN: Liputan6.com, Suara.com, Tirto.id, Kompas.com, Tempo.co, dan TurnBackHoax.id (Mafindo).</p>
<ul><li><b>Kompas.com</b> menyimpulkan tiga kategori: <b>fakta</b>, <b>hoaks</b>, dan <b>sesat</b> (mengandung kebenaran tetapi disebarkan sehingga menyesatkan).</li><li><b>Tirto.id</b> memakai pemeriksaan fakta (live fact-check) dan pemeriksaan data.</li><li><b>TurnBackHoax.id</b> dikelola Mafindo, dengan laporan dari jaringan relawan.</li></ul>
<h3>Elemen pemeriksaan fakta</h3><p><b>Tema pemberitaan</b> (topik berita), <b>sumber berita</b> (cari konfirmasi dari beberapa sumber), dan <b>metode pemeriksaan</b>: verifikasi sumber, pengecekan dengan sumber terpercaya, analisis data dan informasi, serta konfirmasi dan cross-checking.</p>
<h3>Validasi sumber data: Google Reverse Image</h3><ol><li>Buka Google Images.</li><li>Unggah foto atau masukkan URL gambar.</li><li>Lihat hasil gambar yang cocok atau mirip.</li><li>Kunjungi halaman terkait untuk memeriksa konteks.</li><li>Lakukan analisis tambahan: periksa metadata dan tanda manipulasi.</li></ol>
<h3>Evaluasi informasi digital</h3><p>Empat kriteria: <b>pengarang atau organisasi</b> (kredibilitas), <b>ketepatan</b> (sesuai fakta), <b>kekinian</b> (informasi terbaru), dan <b>objektif</b> (netral, berdasarkan fakta dan bukti tanpa bias pribadi).</p>`;
S0[5].m=`<h3>Data</h3><p>Data (bentuk jamak dari <i>datum</i>, bahasa Latin: sesuatu yang diberikan) adalah fakta atau bagian fakta yang digambarkan dengan simbol, gambar, nilai, atau uraian yang bermakna pada konteks tertentu. Data yang baik memenuhi syarat <b>objektif, relevan, sesuai perkembangan (up to date), dan representatif</b>.</p>
<ul><li><b>Data kuantitatif</b>: berbentuk angka atau jumlah, dapat diukur, dan objektif; contoh harga benda, berat badan, suhu tubuh, tinggi badan.</li><li><b>Data kualitatif</b>: berhubungan dengan kategori atau karakteristik (bukan angka) yang tidak dapat diukur; contoh bahasa, pekerjaan, jenis kelamin, sikap.</li></ul>
<h3>Metode pengumpulan data</h3><p>Teknik atau cara mengumpulkan data. <b>Instrumen</b> adalah alat bantu agar pengumpulan data lebih mudah dan sistematis.</p>
<ul><li><b>Angket (kuesioner)</b>: pertanyaan tertulis untuk responden. <i>Terbuka</i>: responden bebas menjawab. <i>Tertutup</i>: pilihan jawaban sudah disediakan.</li>
<li><b>Wawancara</b>: tanya jawab dengan narasumber. <i>Terstruktur</i>: pertanyaan sudah disiapkan, boleh memakai alat bantu (kamera, perekam suara, alat tulis). <i>Tidak terstruktur</i>: pertanyaan tidak disiapkan lebih dahulu.</li>
<li><b>Observasi</b>: pengamatan dan pencatatan fakta untuk mendapat informasi akurat dan faktual. <i>Participant observation</i>: peneliti terlibat langsung. <i>Non participant observation</i>: tidak terlibat langsung.</li>
<li><b>Dokumentasi</b>: menyelidiki benda tertulis seperti buku, majalah, dokumen, dan notulen rapat.</li></ul>`;
S0[6].t="Integrasi Konten Aplikasi Perkantoran";
S0[6].m=`<p>Integrasi software adalah proses menggabungkan atau menghubungkan beberapa perangkat lunak menjadi satu kesatuan yang berfungsi terpadu, untuk meningkatkan efisiensi operasional, mengoptimalkan kinerja sistem, atau memungkinkan berbagi data antaraplikasi. Contoh: Microsoft Office, tempat Word dan Excel sudah terintegrasi.</p>
<h3>a. Perintah Cut, Copy, dan Paste</h3><p>Terinspirasi dari praktik mengedit naskah ketik dengan gunting dan menempelkan potongan ke halaman lain (masih berlangsung hingga 1980-an). Di komputer, data disimpan sementara di <b>clipboard</b>:</p>
<ul><li><b>Cut</b> (potong, Ctrl + X): memindahkan objek ke clipboard.</li><li><b>Copy</b> (salin, Ctrl + C): menyalin objek ke clipboard.</li><li><b>Paste</b> (tempel, Ctrl + V): menempatkan objek dari clipboard ke dokumen tujuan.</li></ul>
<h3>b. Fitur integrasi konten</h3><p>Memilih satu menu di sebuah aplikasi dapat otomatis membuka aplikasi lain. Contoh: menu <b>Insert Chart</b> di Word membuka Microsoft Excel.</p>
<h3>c. Object Linking and Embedding (OLE)</h3><p>Teknologi Microsoft yang memungkinkan objek satu aplikasi di-link atau di-embed ke aplikasi lain tanpa salinan fisik.</p>
<ul><li><b>Linking (penautan)</b>: objek dihubungkan tanpa ditanam; perubahan pada objek asli otomatis tercermin di semua tempat tautan.</li><li><b>Embedding (pencantuman)</b>: objek ditanam sepenuhnya menjadi bagian dokumen; perubahan tidak memengaruhi objek di tempat lain.</li></ul>
<div class="box">Contoh OLE: menyisipkan lembar kerja Excel ke dokumen Word dan memperbarui datanya tanpa keluar dari Word.</div>`;
S0[7].t="Komputer, Komponen, dan Interaksi Manusia dan Komputer";
S0[7].m=`<p>Sistem komputer adalah perangkat-perangkat komputer yang saling berinteraksi untuk melakukan tugas tertentu dan menghasilkan informasi yang diinginkan pengguna. Sistem ini terdiri atas tiga bagian.</p>
<h3>1. Perangkat keras (hardware)</h3><p>Komponen fisik pembentuk sistem komputer, terbagi lima jenis:</p>
<ul><li><b>Masukan (input)</b>: memasukkan data; contoh keyboard, mouse, scanner, joystick.</li><li><b>Proses</b>: otak pengolahan data (menghitung, mengurutkan, mencari, menulis, membaca); contoh CPU, RAM, motherboard.</li><li><b>Keluaran (output)</b>: menampilkan hasil berupa teks, grafik, gambar, atau suara; contoh monitor, speaker, printer.</li><li><b>Penyimpanan (storage)</b>: menyimpan data, informasi, dan program; contoh harddisk, SSD, flash disk.</li><li><b>Tambahan (peripheral)</b>: perangkat yang dihubungkan untuk menambah kegunaan; contoh modem, TV tuner, LAN card.</li></ul>
<h3>2. Perangkat lunak (software)</h3><p>Instruksi (program atau prosedur) yang mengolah data agar komputer dapat bekerja. Berdasarkan fungsinya:</p>
<ul><li><b>Sistem operasi</b>: perangkat lunak pertama yang berjalan saat komputer menyala.</li><li><b>Aplikasi</b>: pengolah kata, pengolah angka, pengolah grafis (CorelDRAW, Photoshop), dan presentasi (PowerPoint, StarOffice Impress).</li><li><b>Pemrograman</b>: untuk mengembangkan, menguji, dan memelihara perangkat lunak. Terdiri atas <b>bahasa mesin</b> (generasi pertama, kode biner 0 dan 1), <b>bahasa Assembly</b> (mnemonic seperti SUB, MOV, CMP, JGE, LOOP), dan <b>bahasa tingkat tinggi</b> (lebih handal dan mudah menulis kodenya).</li><li><b>Utilitas</b>: membantu manajemen dan optimalisasi kinerja sistem komputer.</li></ul>
<h3>3. Pengguna (brainware)</h3><p>Manusia yang memiliki kemampuan dan keahlian menjalankan serta mengatur kinerja software dan hardware.</p>
<h3>Jenis komputer berdasarkan ukuran</h3><ul><li><b>Mikro</b>: paling kecil; ultrabook, konsol permainan, ponsel pintar, tablet.</li><li><b>Mainframe</b>: dirancang untuk dipakai bersamaan; perbankan dan telekomunikasi.</li><li><b>Mini</b>: ukuran sedang; administrasi perkantoran, serbaguna.</li><li><b>Personal (PC)</b>: untuk pemakaian individu.</li><li><b>Superkomputer</b>: memproses data sangat besar dengan cepat; menurut buku pertama dikembangkan tahun 1976.</li></ul>
<h3>Interaksi manusia dan komputer (HCI)</h3><p>Mempelajari bagaimana orang berinteraksi dengan komputer. Jenisnya: <b>GUI</b> (antarmuka grafis: ikon, menu, dialog, tombol), <b>CLI</b> (perintah teks di terminal), melalui <b>suara</b> (audio), melalui <b>gambar</b> (video, memerlukan kamera), dan melalui <b>peranti masukan</b> (keyboard, joystick, mouse, touchpad, layar sentuh, keyboard virtual).</p>`;
S0[8].t="Multitasking dan Cara Kerja Komputer";
S0[8].m=`<h3>Multitasking</h3><p>Kemampuan menjalankan dua program atau lebih pada saat bersamaan, misalnya membuka pengolah kata sambil membuka browser. Jumlah program yang efektif bergantung pada tipe multitasking (preemptive atau cooperative), kecepatan CPU, memori, dan kapasitas harddisk.</p>
<p>Sistem operasi melakukannya dengan algoritma penjadwalan <b>Round Robin (RR)</b>: setiap proses mendapat <b>slot waktu (time slice/kuantum)</b> yang sama dalam urutan melingkar, tanpa prioritas.</p>
<div class="box">Contoh: kuantum 100 ms, job1 butuh 250 ms. Alokasi pertama 100 ms, kedua 100 ms, ketiga hanya 50 ms (selesai). Total waktu CPU job1 = 250 ms.</div>
<ul><li><b>Algoritma pertama</b>: bila job selesai dalam kuantum, hapus dari antrean dan langsung ambil job berikutnya (CPU tidak pernah berhenti); di akhir kuantum, job yang belum selesai diantrekan kembali.</li><li><b>Algoritma kedua</b>: bila job selesai, tunggu sampai kuantum berakhir baru ambil job berikutnya.</li></ul>
<h3>Cara kerja komputer</h3><p>Tiga tahap: <b>input</b> (menerima data dari perangkat masukan), <b>pemrosesan</b> (oleh CPU dan memori), dan <b>output</b> (layar, speaker, printer). Semua komponen terhubung oleh <b>BUS</b>.</p>
<p>Penyimpanan: <b>primer</b> (memori utama, data sementara saat program berjalan) dan <b>sekunder</b> (permanen atau semi permanen pada media magnetik atau optik).</p>
<h3>Cara CPU menjalankan instruksi</h3><ol><li>Instruksi atau data masuk lebih dulu ke RAM melalui input-storage.</li><li>Instruksi ditampung CU di program-storage; data di working-storage.</li><li>CU mengambil instruksi ke <i>instruction register</i>; alamat memorinya disimpan di <i>program counter</i>.</li><li>Data diambil CU ke <i>operand register</i>.</li><li>Untuk operasi aritmetika dan logika, <b>ALU</b> mengerjakannya, hasilnya ditampung di <i>accumulator</i>.</li><li>Hasil dikembalikan ke working-storage, lalu ke output-storage dan ditampilkan di output device.</li></ol>
<p>CPU memiliki <b>clock</b> internal yang menghasilkan detak berkecepatan tetap untuk menyinkronkan operasi. Setiap CPU memahami himpunan instruksi tertentu (<b>instruction set</b>).</p>
<h3>Siklus mesin</h3><p><b>Fetch</b> (CU mengambil instruksi), <b>decode</b> (CU menerjemahkan), ALU mengambil data ke register, lalu <b>execute</b> (ALU menjalankan). Contoh instruksi mesin sederhana untuk X + Y: SIMPAN data ke alamat memori, SALIN dari memori ke REG1 dan REG2, TAMBAH REG1 REG2, SALIN hasil ke memori, lalu PRINT. Jumlah register dan cara operasi merupakan spesifikasi mesin; mesin dengan satu register disebut mesin berakumulator.</p>`;
S0[9].m=`<p>Jaringan komputer adalah kumpulan komputer dan perangkat komunikasi yang terhubung untuk berbagi sumber daya, informasi, dan layanan, serta memungkinkan komunikasi data jarak jauh secara efisien.</p>
<h3>1. Jaringan lokal (LAN)</h3><p><i>Local Area Network</i> menghubungkan komputer dalam wilayah terbatas (rumah, kantor, sekolah, kampus) lewat kabel (wired), nirkabel (wireless), atau keduanya, dengan kecepatan tinggi sekitar 2 hingga 100 Mbps. Satu perangkat biasanya menjadi <b>server</b>, lainnya <b>client</b>. IP address di jaringan lokal disebut <b>IP private</b>.</p>
<p>Keuntungan LAN: berbagi printer, file, dan koneksi internet; file di server memudahkan kolaborasi; kontrol keamanan, pemeliharaan, dan pemantauan lebih baik; backup data lebih mudah dan cepat; fleksibel dikembangkan; komunikasi lewat e-mail dan chat.</p>
<h3>IP address</h3><p>Singkatan <i>Internet Protocol</i>: identitas setiap komputer sekaligus alamat lokasi jaringan. Terdiri atas 32 bit dalam empat bagian (masing-masing 8 bit) yang ditulis dalam desimal.</p>
<div class="box"><code>192.168.10.1 = 11000000.10101000.00001010.00000001</code></div>
<h3>2. Internet</h3><p><i>Inter-network</i>: sekumpulan jaringan komputer yang menghubungkan situs akademik, pemerintahan, bisnis, organisasi, dan individu. Layanannya antara lain e-mail, chatting, diskusi (usenet, mailing list), WWW, serta transfer file (Telnet, FTP). Jaringan internet beroperasi dengan protokol standar <b>TCP/IP</b>, yang dapat bekerja pada berbagai perangkat keras dan sistem operasi. Untuk mengakses internet diperlukan layanan <b>ISP</b> (<i>Internet Service Provider</i>), perusahaan penyedia jasa akses internet.</p>
<h3>3. Konektivitas internet</h3><p><b>Jaringan berkabel (wired):</b></p>
<ul><li><b>Dial-up</b>: lewat sambungan telepon rumah dan jalur PSTN ke ISP; perlu komputer, modem, dan saluran telepon; kecepatan maksimum 56 Kbps.</li><li><b>ADSL</b> (<i>Asymmetric Digital Subscriber Line</i>): data berkecepatan tinggi lewat kabel tembaga telepon; sifatnya asimetrik (kecepatan berbeda antarsisi); modem bekerja pada 34 kHz sampai 1104 kHz.</li><li><b>LAN</b>: satu komputer server terhubung ke ISP; komputer lain terkoneksi lewat LAN card dan kabel UTP.</li></ul>
<p><b>Jaringan nirkabel (wireless):</b> memakai gelombang elektromagnetik.</p>
<ul><li><b>GPRS</b>: pengiriman data lewat jaringan GSM; sekitar 56 Kbps hingga beberapa ratus Kbps.</li><li><b>Wi-Fi</b>: memakai gelombang radio pada frekuensi 2,4 GHz dan 5 GHz.</li><li><b>Satelit</b>: antena parabola, kecepatan akses tinggi tetapi mahal, terutama di Indonesia.</li></ul>`;
S0[10].m=`<p>Komunikasi data adalah pengiriman dan penerimaan informasi antarperangkat lewat saluran komunikasi (kabel tembaga, serat optik, atau nirkabel) agar data tersampaikan cepat dan akurat. Pada ponsel, pemancar dan penerima sinyal adalah <b>BTS</b> (<i>Base Transceiver Station</i>).</p>
<h3>Alur pengiriman SMS</h3><p>Pesan dikirim dari ponsel ke BTS, lalu BSC (<i>Base Station Controller</i>), lalu MSC (<i>Mobile Switching Center</i>), diteruskan ke SMSC (<i>Short Message Service Center</i>) untuk disimpan. SMSC memeriksa lewat HLR (<i>Home Location Register</i>) apakah ponsel tujuan aktif dan di mana posisinya. Jika tidak aktif, pesan disimpan sampai batas <i>validity period</i>; jika aktif, pesan dikirim lewat MSC, BSC, dan BTS penerima.</p>
<h3>Koneksi jaringan pada ponsel</h3><ul><li><b>Kabel data</b>: jangkauan terbatas sesuai panjang kabel.</li><li><b>Bluetooth</b>: tanpa kabel, gelombang elektromagnetik pada frekuensi sekitar 2,4 sampai 2,45 GHz, jangkauan sangat dekat.</li><li><b>Wi-Fi</b>: bandwidth besar dan hemat baterai, tetapi jangkauan maksimum sekitar 100 meter.</li></ul>
<h3>Jaringan internet seluler</h3><ul><li><b>GPRS</b>: 56 sampai 115 Kbps.</li><li><b>EDGE</b>: 120 sampai 384 Kbps.</li><li><b>3G</b>: 384 Kbps sampai 2 Mbps.</li><li><b>HSPA</b> (3,5G): 600 Kbps sampai 10 Mbps; HSDPA dikenal sebagai H+ di layar ponsel.</li><li><b>LTE (4G)</b>: hingga 100 Mbps.</li><li><b>5G</b>: hingga 10 Gbps (10 sampai 100 kali lebih cepat dari 4G).</li></ul>`;

if(od<=1&&oa>0){const dd=Math.max(od,0),s=sc(dd),y=fy(dd)+Math.max(0,-od)*1200;c.save();c.globalAlpha=oa*Math.min(1,(1-od)*8);
if(st==="hit"){const k=1+tS*.7,cy=y-WH*.2*s;c.translate(CX,cy);c.scale(k,k);c.translate(-CX,-cy)}
obst(CX,y,HW*.42*s,WH*.42*s);c.restore()}
player();
if(fl>0){c.fillStyle="rgba(220,30,30,"+.38*fl+")";c.fillRect(-20,-20,W+40,H+40)}
if(st==="done"){c.fillStyle="rgba(255,209,92,.14)";c.fillRect(-20,-20,W+40,H+40);c.fillStyle="#ffd15c";c.font="bold 44px system-ui,sans-serif";c.textAlign="center";c.fillText("SELESAI!",CX,70)}
c.restore()}
function fr(now){if(!cv.isConnected)return;const dt=Math.min(.05,(now-last)/1e3);last=now;let v=0;
if(st==="ready"||st==="done")v=2.5;
else if(st==="run"){v=9*Math.min(1,.25+(od-DS)*2.5);od-=v*dt/16;if(od<=DS){od=DS;st="ask";showQ()}}
else if(st==="jump"){v=4;tS+=dt;od-=v*dt/16;jp=Math.sin(Math.PI*Math.min(1,tS/1));if(tS>=1)next()}
else if(st==="hit"){tS+=dt;oa=Math.max(0,1-tS/.8);fl=Math.max(0,1-tS/.7);if(tS>=1.1)next()}
pos+=v*dt;ph+=v*dt*1.1;draw();requestAnimationFrame(fr)}
requestAnimationFrame(fr)}

function rekap(){
  const myRows=S.map((s,i)=>{const r=res[i];return`<tr><td>${s.t}</td><td>${r?r.b+"/"+r.n:"-"}</td><td><b>${r?r.s:"-"}</b></td><td>${r?(r.s>=75?"Tuntas":"Perlu remedial"):"Belum"}</td></tr>`}).join("");
  const n=Object.keys(res).length;

  // Tabel Seluruh Siswa dari Spreadsheet
  const allRows = allScores.length ? allScores.map(row=>`<tr><td>${esc(row.nama)}</td><td>${esc(row.kelas)}</td><td>${esc(row.bab)}</td><td><b>${row.nilai}</b></td><td>${new Date(row.timestamp).toLocaleString("id-ID")}</td></tr>`).join("") : `<tr><td colspan="5" class="mu">Belum ada data siswa lain atau gagal memuat.</td></tr>`;

  return`<div class="card">
    <h2>Rekap Nilai Pribadi</h2><p><b>${esc(U.n)}</b> · ${U.k}</p>
    <div class="tw"><table><tr><th>Bab</th><th>Benar</th><th>Nilai</th><th>Status</th></tr>${myRows}<tr><th>Rata-rata (${n}/${S.length} bab)</th><th></th><th>${n?avg():"-"}</th><th></th></tr></table></div>
    
    <h2 style="margin-top:28px">Rekap Nilai Seluruh Siswa (Database)</h2>
    <p class="mu">Data nilai dari semua siswa yang telah mengumpulkan tugas/latihan:</p>
    <div class="tw"><table><tr><th>Nama Siswa</th><th>Kelas</th><th>Bab</th><th>Nilai</th><th>Waktu Kirim</th></tr>${allRows}</table></div>
    
    <p class="mu" style="margin-top:14px">Tekan Cetak untuk menyimpan laporan Anda sebagai PDF.</p>
    <button id="pr">🖨️ Cetak / Simpan PDF</button>
  </div>`;
}

load();fetchAllScores();render();
</script>
